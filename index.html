<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Digital - Warung Uwa RJ</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #FF7043; 
            --primary-hover: #F4511E;
            --secondary: #26A69A; 
            --bg-color: #F4F7F6;
            --surface: #FFFFFF;
            --text-dark: #2C3E50;
            --text-light: #7F8C8D;
            --radius: 16px;
            --shadow: 0 10px 30px rgba(0,0,0,0.08);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Nunito', sans-serif; }

        body { background: var(--bg-color); color: var(--text-dark); padding-bottom: 50px; }

        /* Header App */
        .app-header {
            background: var(--surface); padding: 20px 40px; box-shadow: 0 4px 15px rgba(0,0,0,0.03);
            display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100;
        }
        .app-header h1 { color: var(--primary); font-size: 1.8em; display: flex; align-items: center; gap: 10px; }

        /* Navigasi */
        .nav-menu { display: flex; gap: 10px; background: #EDF2F7; padding: 5px; border-radius: 12px; }
        .nav-btn { padding: 10px 20px; font-size: 1em; border: none; border-radius: 8px; cursor: pointer; background: transparent; color: var(--text-light); font-weight: 700; transition: all 0.3s ease; }
        .nav-btn.active { background: var(--surface); color: var(--primary); box-shadow: 0 2px 8px rgba(0,0,0,0.1); }

        .container { display: flex; gap: 30px; max-width: 1200px; margin: 40px auto; padding: 0 20px; align-items: flex-start; }

        /* Grid Katalog */
        .katalog { flex: 2; display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 25px; }
        
        .card { 
            background: var(--surface); padding: 20px; border-radius: var(--radius); box-shadow: var(--shadow); 
            cursor: pointer; transition: all 0.3s ease; position: relative; display: flex; flex-direction: column; 
            align-items: center; text-align: center; border: 2px solid transparent;
        }
        .card:hover { transform: translateY(-8px); border-color: rgba(255, 112, 67, 0.3); box-shadow: 0 15px 35px rgba(255, 112, 67, 0.15); }
        .card-icon { font-size: 3em; margin-bottom: 15px; background: #FFF3E0; width: 80px; height: 80px; display: flex; align-items: center; justify-content: center; border-radius: 50%; }
        .card h3 { font-size: 1.1em; margin-bottom: 5px; color: var(--text-dark); }
        .card p { color: var(--primary); font-weight: 800; font-size: 1.2em; margin-bottom: 10px;}
        .badge { background: #E0F2F1; color: var(--secondary); font-size: 0.75em; padding: 4px 10px; border-radius: 20px; font-weight: 700; }

        /* Panel Samping */
        .box-panel { flex: 1; min-width: 360px; background: var(--surface); padding: 30px; border-radius: var(--radius); box-shadow: var(--shadow); position: sticky; top: 100px; }
        .box-panel h2 { border-bottom: 2px dashed #eee; padding-bottom: 15px; margin-bottom: 20px; font-size: 1.4em; display: flex; align-items: center; gap: 10px; }
        
        /* Form Admin */
        .input-group { margin-bottom: 20px; }
        .input-group label { display: block; margin-bottom: 8px; font-weight: 700; color: var(--text-dark); font-size: 0.95em; }
        .input-wrapper { position: relative; }
        .input-wrapper i { position: absolute; left: 15px; top: 50%; transform: translateY(-50%); color: var(--text-light); }
        .input-group input, .input-group select { 
            width: 100%; padding: 12px 15px 12px 40px; border: 2px solid #EDF2F7; border-radius: 10px; font-size: 1em; font-weight: 600; color: var(--text-dark); outline: none; transition: 0.3s;
        }
        .input-group input:focus, .input-group select:focus { border-color: var(--primary); box-shadow: 0 0 0 4px rgba(255, 112, 67, 0.1); }

        /* Keranjang Belanja Multiple Items */
        .cart-list { max-height: 350px; overflow-y: auto; padding-right: 10px; margin-bottom: 20px; }
        .cart-list::-webkit-scrollbar { width: 6px; }
        .cart-list::-webkit-scrollbar-thumb { background: #ccc; border-radius: 10px; }
        
        .cart-item { background: #FFF9F7; border: 1px solid #FFE0B2; padding: 15px; border-radius: 10px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
        .cart-item-info h4 { color: var(--primary); font-size: 1.1em; margin-bottom: 4px; }
        .cart-item-info p { color: var(--text-light); font-size: 0.85em; font-weight: 600; margin-bottom: 0; }
        
        .qty-controls { display: flex; align-items: center; gap: 10px; background: white; padding: 5px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); border: 1px solid #eee; }
        .qty-btn { background: none; border: none; color: var(--primary); font-size: 1.2em; cursor: pointer; width: 25px; height: 25px; display: flex; align-items: center; justify-content: center; border-radius: 4px; }
        .qty-btn:hover { background: #FFF3E0; }
        .qty-number { font-weight: 800; min-width: 20px; text-align: center; }

        .total-box { background: linear-gradient(135deg, var(--primary), var(--primary-hover)); padding: 20px; border-radius: 12px; text-align: center; margin-bottom: 20px; color: white; box-shadow: 0 8px 20px rgba(255, 112, 67, 0.3); }
        .total-box small { font-size: 0.9em; opacity: 0.9; text-transform: uppercase; letter-spacing: 1px;}
        .total-box h3 { margin: 5px 0 0 0; font-size: 2em; font-weight: 800;}

        .btn { background: var(--primary); color: white; border: none; padding: 15px; border-radius: 10px; cursor: pointer; width: 100%; font-size: 1.1em; font-weight: 800; transition: 0.3s; display: flex; justify-content: center; align-items: center; gap: 10px; }
        .btn:hover { background: var(--primary-hover); transform: translateY(-2px); box-shadow: 0 5px 15px rgba(255, 112, 67, 0.4);}
        .btn:disabled { background: #BDC3C7; cursor: not-allowed; transform: none; box-shadow: none;}
        .btn-success { background: var(--secondary); }
        .btn-success:hover { background: #00897B; box-shadow: 0 5px 15px rgba(38, 166, 154, 0.4);}

        /* Toast & Spinner */
        #toast-container { position: fixed; bottom: 30px; right: 30px; z-index: 9999; display: flex; flex-direction: column; gap: 10px; }
        .toast { background: white; padding: 15px 25px; border-radius: 10px; box-shadow: 0 10px 30px rgba(0,0,0,0.15); display: flex; align-items: center; gap: 15px; transform: translateX(120%); transition: transform 0.4s ease; font-weight: 700; }
        .toast.show { transform: translateX(0); }
        .toast.success i { color: var(--secondary); font-size: 1.5em; }
        .toast.error i { color: #E74C3C; font-size: 1.5em; }
        .spinner { border: 4px solid rgba(0,0,0,0.1); width: 40px; height: 40px; border-radius: 50%; border-left-color: var(--primary); animation: spin 1s linear infinite; margin: 20px auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <header class="app-header">
        <h1><i class="fa-solid fa-store"></i> Warung Uwa RJ</h1>
        <div class="nav-menu">
            <button class="nav-btn active" id="btn-kasir" onclick="switchMode('kasir')"><i class="fa-solid fa-calculator"></i> Kasir</button>
            <button class="nav-btn" id="btn-admin" onclick="switchMode('admin')"><i class="fa-solid fa-box-open"></i> Input Barang</button>
        </div>
    </header>

    <div id="toast-container"></div>
    
    <!-- MODE KASIR -->
    <div class="container" id="view-kasir">
        <div class="katalog" id="katalog">
            <div style="grid-column: 1/-1; text-align: center; color: var(--text-light); margin-top: 50px;">
                <div class="spinner"></div><p>Memuat etalase warung...</p>
            </div>
        </div>

        <div class="box-panel">
            <h2><i class="fa-solid fa-receipt"></i> Keranjang Belanja</h2>
            
            <div id="empty-cart" style="text-align: center; padding: 40px 0; color: #BDC3C7;">
                <i class="fa-solid fa-cart-arrow-down" style="font-size: 4em; margin-bottom: 15px;"></i>
                <p>Keranjang masih kosong.<br>Klik barang di rak untuk menambah.</p>
            </div>

            <div id="cart-form" style="display:none;">
                
                <div class="cart-list" id="cart-items-container">
                    <!-- Item list di-generate pakai JS -->
                </div>
                
                <div class="total-box">
                    <small>Grand Total</small>
                    <h3>Rp <span id="grand-total">0</span></h3>
                </div>
                
                <button class="btn" id="btn-submit-trx" onclick="submitTransaction()">
                    <i class="fa-solid fa-print"></i> Proses Bayar
                </button>
                <button class="btn" onclick="clearCart()" style="background: #eee; color: #7f8c8d; margin-top: 10px; box-shadow: none;">
                    <i class="fa-solid fa-trash-can"></i> Kosongkan
                </button>
            </div>
        </div>
    </div>

    <!-- MODE INPUT KATALOG -->
    <div class="container" id="view-admin" style="display: none; justify-content: center;">
        <div class="box-panel" style="flex: unset; width: 450px;">
            <h2><i class="fa-solid fa-plus-circle"></i> Tambah Barang Baru</h2>
            <div class="input-group">
                <label>Nama Barang</label>
                <div class="input-wrapper">
                    <i class="fa-solid fa-tag"></i>
                    <input type="text" id="new-nama" placeholder="Contoh: Kopi Hitam Kapal Api">
                </div>
            </div>
            <div class="input-group">
                <label>Kategori</label>
                <div class="input-wrapper">
                    <i class="fa-solid fa-layer-group"></i>
                    <select id="new-kategori">
                        <option value="Makanan">Makanan / Cemilan</option>
                        <option value="Minuman">Minuman</option>
                        <option value="Sembako">Sembako</option>
                        <option value="Lainnya">Lainnya</option>
                    </select>
                </div>
            </div>
            <div class="input-group">
                <label>Harga Jual (Rp)</label>
                <div class="input-wrapper">
                    <i class="fa-solid fa-rupiah-sign"></i>
                    <input type="number" id="new-harga" placeholder="Contoh: 3000">
                </div>
            </div>
            <div class="input-group">
                <label>Stok Awal</label>
                <div class="input-wrapper">
                    <i class="fa-solid fa-boxes-stacked"></i>
                    <input type="number" id="new-stok" placeholder="Contoh: 20" value="10">
                </div>
            </div>
            <button class="btn btn-success" id="btn-submit-katalog" onclick="submitKatalog()">
                <i class="fa-solid fa-cloud-arrow-up"></i> Simpan ke Database
            </button>
        </div>
    </div>

    <script>
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbylpjRA1OTkSKK2HEYYh2JLpj1do3JR5KAfyjlL9rp_V6ctFgFrnXKq9_KgdS1scBfJ/exec';

        // Array Keranjang
        let cart = []; 

        function showToast(message, type = 'success') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            const icon = type === 'success' ? 'fa-circle-check' : 'fa-circle-exclamation';
            toast.innerHTML = `<i class="fa-solid ${icon}"></i> <span>${message}</span>`;
            container.appendChild(toast);
            setTimeout(() => toast.classList.add('show'), 10);
            setTimeout(() => {
                toast.classList.remove('show');
                setTimeout(() => toast.remove(), 400);
            }, 3500);
        }

        function switchMode(mode) {
            if(mode === 'kasir') {
                document.getElementById('view-kasir').style.display = 'flex';
                document.getElementById('view-admin').style.display = 'none';
                document.getElementById('btn-kasir').classList.add('active');
                document.getElementById('btn-admin').classList.remove('active');
                loadData(); 
            } else {
                document.getElementById('view-kasir').style.display = 'none';
                document.getElementById('view-admin').style.display = 'flex';
                document.getElementById('btn-kasir').classList.remove('active');
                document.getElementById('btn-admin').classList.add('active');
            }
        }

        window.onload = loadData;

        function getCategoryIcon(kategori) {
            const k = (kategori || '').toLowerCase();
            if(k.includes('makanan') || k.includes('cemilan')) return '🍜';
            if(k.includes('minuman')) return '🥤';
            if(k.includes('sembako')) return '🍚';
            return '📦';
        }

        function loadData() {
            const katalogDiv = document.getElementById('katalog');
            katalogDiv.innerHTML = '<div style="grid-column: 1/-1; text-align: center; color: var(--text-light); margin-top: 50px;"><div class="spinner"></div><p>Sinkronisasi data dari spreadsheet...</p></div>';

            fetch(SCRIPT_URL)
                .then(res => res.json())
                .then(data => {
                    katalogDiv.innerHTML = '';
                    if(data.length === 0) {
                        katalogDiv.innerHTML = '<p style="grid-column: 1/-1; text-align:center; color:#95a5a6;">Belum ada barang. Silakan input di menu Input Barang.</p>';
                        return;
                    }
                    data.forEach(item => {
                        if(!item.Nama_Barang) return;
                        const emoji = getCategoryIcon(item.Kategori);
                        const harga = parseInt(item.Harga_Satuan).toLocaleString('id-ID');
                        const div = document.createElement('div');
                        div.className = 'card';
                        div.innerHTML = `<div class="card-icon">${emoji}</div><h3>${item.Nama_Barang}</h3><p>Rp ${harga}</p><span class="badge">${item.Kategori || 'Lainnya'}</span>`;
                        // Saat diklik, panggil addToCart
                        div.onclick = () => addToCart(item.Nama_Barang, item.Harga_Satuan);
                        katalogDiv.appendChild(div);
                    });
                })
                .catch(err => {
                    katalogDiv.innerHTML = '<p style="grid-column: 1/-1; text-align:center; color:#e74c3c;"><i class="fa-solid fa-triangle-exclamation"></i> Gagal memuat data.</p>';
                });
        }

        // --- FUNGSI KERANJANG BARU ---
        function addToCart(name, price) {
            const existingItem = cart.find(item => item.name === name);
            if(existingItem) {
                existingItem.qty += 1;
            } else {
                cart.push({ name: name, price: parseInt(price), qty: 1 });
            }
            renderCart();
        }

        function updateQty(index, delta) {
            cart[index].qty += delta;
            if(cart[index].qty <= 0) {
                cart.splice(index, 1); // Hapus jika nol
            }
            renderCart();
        }

        function clearCart() {
            cart = [];
            renderCart();
        }

        function renderCart() {
            const container = document.getElementById('cart-items-container');
            const emptyCart = document.getElementById('empty-cart');
            const cartForm = document.getElementById('cart-form');
            
            if(cart.length === 0) {
                emptyCart.style.display = 'block';
                cartForm.style.display = 'none';
                return;
            }

            emptyCart.style.display = 'none';
            cartForm.style.display = 'block';
            container.innerHTML = '';
            
            let grandTotal = 0;

            cart.forEach((item, index) => {
                const subtotal = item.price * item.qty;
                grandTotal += subtotal;

                const div = document.createElement('div');
                div.className = 'cart-item';
                div.innerHTML = `
                    <div class="cart-item-info">
                        <h4>${item.name}</h4>
                        <p>Rp ${item.price.toLocaleString('id-ID')} / pcs</p>
                    </div>
                    <div class="qty-controls">
                        <button class="qty-btn" onclick="updateQty(${index}, -1)"><i class="fa-solid fa-minus"></i></button>
                        <span class="qty-number">${item.qty}</span>
                        <button class="qty-btn" onclick="updateQty(${index}, 1)"><i class="fa-solid fa-plus"></i></button>
                    </div>
                `;
                container.appendChild(div);
            });

            document.getElementById('grand-total').innerText = grandTotal.toLocaleString('id-ID');
        }

        function submitTransaction() {
            // Siapkan format array untuk dikirim
            const itemsToSubmit = cart.map(item => {
                return {
                    nama_barang: item.name,
                    harga_satuan: item.price,
                    jumlah_beli: item.qty,
                    total_harga: item.price * item.qty
                }
            });

            const payload = {
                action: 'transaksi_multi', // PENTING! Aksi baru untuk GAS
                items: itemsToSubmit
            };
            
            const btn = document.getElementById('btn-submit-trx');
            const originalText = btn.innerHTML;
            btn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i> Memproses...'; 
            btn.disabled = true;

            fetch(SCRIPT_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(payload) })
            .then(res => res.json())
            .then(() => {
                showToast('Semua pesanan berhasil dicatat!', 'success');
                btn.innerHTML = originalText; 
                btn.disabled = false;
                clearCart();
            })
            .catch(err => {
                showToast('Gagal menyimpan transaksi. Coba lagi.', 'error');
                btn.innerHTML = originalText; 
                btn.disabled = false;
            });
        }

        // --- FUNGSI KATALOG (TETAP SAMA) ---
        function submitKatalog() {
            const payload = {
                action: 'tambah_katalog',
                nama_barang: document.getElementById('new-nama').value,
                kategori: document.getElementById('new-kategori').value,
                harga_satuan: parseInt(document.getElementById('new-harga').value),
                stok: parseInt(document.getElementById('new-stok').value)
            };
            if(!payload.nama_barang || !payload.harga_satuan) { showToast('Nama Barang dan Harga wajib diisi!', 'error'); return; }

            const btn = document.getElementById('btn-submit-katalog');
            const originalText = btn.innerHTML;
            btn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i> Menyimpan...'; 
            btn.disabled = true;

            fetch(SCRIPT_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(payload) })
            .then(res => res.json())
            .then(() => {
                showToast(`Barang ${payload.nama_barang} berhasil ditambahkan!`, 'success');
                btn.innerHTML = originalText; btn.disabled = false;
                document.getElementById('new-nama').value = '';
                document.getElementById('new-harga').value = '';
            })
            .catch(err => {
                showToast('Gagal menyimpan barang. Coba lagi.', 'error');
                btn.innerHTML = originalText; btn.disabled = false;
            });
        }
    </script>
</body>
</html>
