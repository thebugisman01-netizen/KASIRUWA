<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <!-- Meta tag wajib agar skala layar HP pas dan tidak mengecil sendiri -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sistem Digital - Warung Uwa RJ</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #FF7043; 
            --primary-hover: #F4511E;
            --secondary: #26A69A; 
            --bg-color: #F4F7F6;
            --surface: #FFFFFF;
            --text-dark: #2C3E50;
            --text-light: #7F8C8D;
            --radius: 16px;
            --shadow: 0 10px 30px rgba(0,0,0,0.08);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Nunito', sans-serif; -webkit-tap-highlight-color: transparent; }

        body { background: var(--bg-color); color: var(--text-dark); padding-bottom: 80px; }

        /* Header App */
        .app-header {
            background: var(--surface); padding: 15px 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.03);
            display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100;
        }
        .app-header h1 { color: var(--primary); font-size: 1.4em; display: flex; align-items: center; gap: 8px; }

        /* Navigasi */
        .nav-menu { display: flex; gap: 5px; background: #EDF2F7; padding: 4px; border-radius: 10px; }
        .nav-btn { padding: 8px 12px; font-size: 0.85em; border: none; border-radius: 7px; cursor: pointer; background: transparent; color: var(--text-light); font-weight: 700; transition: all 0.3s ease; }
        .nav-btn.active { background: var(--surface); color: var(--primary); box-shadow: 0 2px 8px rgba(0,0,0,0.1); }

        /* Container Responsif */
        .container { display: flex; gap: 20px; max-width: 1200px; margin: 20px auto; padding: 0 15px; align-items: flex-start; }

        /* Grid Katalog (Default Laptop: Kolom Fleksibel) */
        .katalog { flex: 2; display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 15px; width: 100%; }
        
        .card { 
            background: var(--surface); padding: 15px; border-radius: var(--radius); box-shadow: var(--shadow); 
            cursor: pointer; transition: all 0.3s ease; position: relative; display: flex; flex-direction: column; 
            align-items: center; text-align: center; border: 2px solid transparent;
        }
        .card:hover { transform: translateY(-4px); border-color: rgba(255, 112, 67, 0.3); }
        .card-icon { font-size: 2.5em; margin-bottom: 10px; background: #FFF3E0; width: 65px; height: 65px; display: flex; align-items: center; justify-content: center; border-radius: 50%; }
        .card h3 { font-size: 1em; margin-bottom: 4px; color: var(--text-dark); }
        .card p { color: var(--primary); font-weight: 800; font-size: 1.1em; margin-bottom: 8px;}
        .badge { background: #E0F2F1; color: var(--secondary); font-size: 0.7em; padding: 3px 8px; border-radius: 20px; font-weight: 700; }

        /* Panel Samping (Keranjang Desktop) */
        .box-panel { flex: 1; min-width: 320px; background: var(--surface); padding: 20px; border-radius: var(--radius); box-shadow: var(--shadow); position: sticky; top: 80px; }
        .box-panel h2 { border-bottom: 2px dashed #eee; padding-bottom: 12px; margin-bottom: 15px; font-size: 1.2em; display: flex; align-items: center; gap: 8px; }
        
        /* Form & Input */
        .input-group { margin-bottom: 15px; }
        .input-group label { display: block; margin-bottom: 6px; font-weight: 700; color: var(--text-dark); font-size: 0.9em; }
        .input-wrapper { position: relative; }
        .input-wrapper i { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--text-light); }
        .input-group input, .input-group select { 
            width: 100%; padding: 10px 12px 10px 36px; border: 2px solid #EDF2F7; border-radius: 8px; font-size: 0.95em; font-weight: 600; color: var(--text-dark); outline: none; transition: 0.3s;
        }
        .input-group input:focus, .input-group select:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(255, 112, 67, 0.1); }

        /* Keranjang List */
        .cart-list { max-height: 280px; overflow-y: auto; padding-right: 5px; margin-bottom: 15px; }
        .cart-item { background: #FFF9F7; border: 1px solid #FFE0B2; padding: 12px; border-radius: 8px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; }
        .cart-item-info h4 { color: var(--primary); font-size: 0.95em; margin-bottom: 2px; }
        .cart-item-info p { color: var(--text-light); font-size: 0.8em; font-weight: 600; margin-bottom: 0; }
        
        .qty-controls { display: flex; align-items: center; gap: 8px; background: white; padding: 4px; border-radius: 6px; border: 1px solid #eee; }
        .qty-btn { background: none; border: none; color: var(--primary); font-size: 1.1em; cursor: pointer; width: 22px; height: 22px; display: flex; align-items: center; justify-content: center; border-radius: 4px; }
        .qty-number { font-weight: 800; min-width: 18px; text-align: center; font-size: 0.9em; }

        .total-box { background: linear-gradient(135deg, var(--primary), var(--primary-hover)); padding: 15px; border-radius: 10px; text-align: center; margin-bottom: 15px; color: white; box-shadow: 0 5px 15px rgba(255, 112, 67, 0.2); }
        .total-box small { font-size: 0.8em; opacity: 0.9; text-transform: uppercase; }
        .total-box h3 { margin: 3px 0 0 0; font-size: 1.6em; font-weight: 800;}

        .btn { background: var(--primary); color: white; border: none; padding: 12px; border-radius: 8px; cursor: pointer; width: 100%; font-size: 1em; font-weight: 800; transition: 0.3s; display: flex; justify-content: center; align-items: center; gap: 8px; }
        .btn:hover { background: var(--primary-hover); }
        .btn-success { background: var(--secondary); }

        /* Tombol Keranjang Mengambang Khusus HP (Floating Action Button) */
        #cart-fab {
            display: none; position: fixed; bottom: 20px; right: 20px; background: var(--primary); color: white;
            width: 55px; height: 55px; border-radius: 50%; box-shadow: 0 4px 15px rgba(255,112,67,0.4);
            align-items: center; justify-content: center; font-size: 1.3em; z-index: 1000; cursor: pointer;
        }
        #cart-fab .badge-count {
            position: absolute; top: -5px; right: -5px; background: #E74C3C; color: white; 
            font-size: 0.7em; width: 22px; height: 22px; border-radius: 50%; display: flex; 
            align-items: center; justify-content: center; font-weight: 800; border: 2px solid white;
        }

        /* --- KODE KHUSUS MEDIA QUERY UNTUK LAYAR HP (Lebar < 768px) --- */
        @media (max-width: 768px) {
            .container { flex-direction: column; padding: 10px; margin: 10px auto; }
            .katalog { grid-template-columns: repeat(2, 1fr); gap: 10px; } /* 2 Kolom pas di HP */
            .card { padding: 10px; }
            .card-icon { width: 50px; height: 50px; font-size: 1.8em; margin-bottom: 5px; }
            .card h3 { font-size: 0.85em; }
            .card p { font-size: 0.95em; }
            
            /* Ubah Panel Keranjang Jadi Pop-up / Drawer di HP */
            .box-panel {
                position: fixed; bottom: 0; left: 0; width: 100%; max-height: 85vh; 
                border-radius: 20px 20px 0 0; box-shadow: 0 -5px 25px rgba(0,0,0,0.15);
                transform: translateY(110%); transition: transform 0.3s ease-in-out;
                z-index: 2000; overflow-y: auto; top: auto;
            }
            .box-panel.open-mobile { transform: translateY(0); }
            
            /* Tampilkan Tombol Melayang Keranjang di HP */
            #cart-fab { display: flex; }
            
            /* Tombol Tutup Drawer untuk HP */
            .close-drawer { display: block !important; }
        }

        .close-drawer { display: none; background: none; border: none; font-size: 1.2em; color: var(--text-dark); cursor: pointer; }

        /* Toast & Spinner */
        #toast-container { position: fixed; bottom: 30px; right: 20px; z-index: 9999; display: flex; flex-direction: column; gap: 10px; }
        .toast { background: white; padding: 12px 20px; border-radius: 8px; box-shadow: 0 5px 20px rgba(0,0,0,0.15); display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 0.9em; }
        .toast.success i { color: var(--secondary); }
        .toast.error i { color: #E74C3C; }
        .spinner { border: 3px solid rgba(0,0,0,0.1); width: 35px; height: 35px; border-radius: 50%; border-left-color: var(--primary); animation: spin 1s linear infinite; margin: 20px auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <header class="app-header">
        <h1><i class="fa-solid fa-store"></i> Warung Uwa RJ</h1>
        <div class="nav-menu">
            <button class="nav-btn active" id="btn-kasir" onclick="switchMode('kasir')"><i class="fa-solid fa-calculator"></i> Kasir</button>
            <button class="nav-btn" id="btn-admin" onclick="switchMode('admin')"><i class="fa-solid fa-box-open"></i> Input</button>
        </div>
    </header>

    <div id="toast-container"></div>
    
    <!-- Tombol Melayang Keranjang khusus Tampilan HP -->
    <div id="cart-fab" onclick="toggleMobileCart()">
        <i class="fa-solid fa-cart-shopping"></i>
        <div class="badge-count" id="fab-count">0</div>
    </div>
    
    <!-- MODE KASIR -->
    <div class="container" id="view-kasir">
        <div class="katalog" id="katalog">
            <div style="grid-column: 1/-1; text-align: center; color: var(--text-light); margin-top: 30px;">
                <div class="spinner"></div><p>Memuat etalase...</p>
            </div>
        </div>

        <!-- Panel Keranjang (Otomatis jadi Drawer geser dari bawah di HP) -->
        <div class="box-panel" id="cart-panel">
            <div style="display: flex; justify-content: space-between; align-items: center;">
                <h2><i class="fa-solid fa-receipt"></i> Keranjang</h2>
                <button class="close-drawer" onclick="toggleMobileCart()"><i class="fa-solid fa-xmark"></i></button>
            </div>
            
            <div id="empty-cart" style="text-align: center; padding: 25px 0; color: #BDC3C7;">
                <i class="fa-solid fa-cart-arrow-down" style="font-size: 3em; margin-bottom: 10px;"></i>
                <p style="font-size: 0.9em;">Keranjang masih kosong.</p>
            </div>

            <div id="cart-form" style="display:none;">
                <div class="cart-list" id="cart-items-container"></div>
                
                <div class="total-box">
                    <small>Grand Total</small>
                    <h3>Rp <span id="grand-total">0</span></h3>
                </div>
                
                <button class="btn" id="btn-submit-trx" onclick="submitTransaction()">
                    <i class="fa-solid fa-print"></i> Proses Bayar
                </button>
                <button class="btn" onclick="clearCart()" style="background: #eee; color: #7f8c8d; margin-top: 8px; box-shadow: none;">
                    <i class="fa-solid fa-trash-can"></i> Kosongkan
                </button>
            </div>
        </div>
    </div>

    <!-- MODE INPUT KATALOG -->
    <div class="container" id="view-admin" style="display: none; justify-content: center;">
        <div class="box-panel" style="flex: unset; width: 100%; max-width: 450px; position: static;">
            <h2><i class="fa-solid fa-plus-circle"></i> Tambah Barang Baru</h2>
            <div class="input-group">
                <label>Nama Barang</label>
                <div class="input-wrapper">
                    <i class="fa-solid fa-tag"></i>
                    <input type="text" id="new-nama" placeholder="Contoh: Kopi Hitam">
                </div>
            </div>
            <div class="input-group">
                <label>Kategori</label>
                <div class="input-wrapper">
                    <i class="fa-solid fa-layer-group"></i>
                    <select id="new-kategori">
                        <option value="Makanan">Makanan / Cemilan</option>
                        <option value="Minuman">Minuman</option>
                        <option value="Sembako">Sembako</option>
                        <option value="Lainnya">Lainnya</option>
                    </select>
                </div>
            </div>
            <div class="input-group">
                <label>Harga Jual (Rp)</label>
                <div class="input-wrapper">
                    <i class="fa-solid fa-rupiah-sign"></i>
                    <input type="number" id="new-harga" placeholder="Contoh: 3000">
                </div>
            </div>
            <div class="input-group">
                <label>Stok Awal</label>
                <div class="input-wrapper">
                    <i class="fa-solid fa-boxes-stacked"></i>
                    <input type="number" id="new-stok" placeholder="Contoh: 20" value="10">
                </div>
            </div>
            <button class="btn btn-success" id="btn-submit-katalog" onclick="submitKatalog()">
                <i class="fa-solid fa-cloud-arrow-up"></i> Simpan ke Database
            </button>
        </div>
    </div>

    <script>
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbylpjRA1OTkSKK2HEYYh2JLpj1do3JR5KAfyjlL9rp_V6ctFgFrnXKq9_KgdS1scBfJ/exec';
        let cart = []; 

        function showToast(message, type = 'success') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            const icon = type === 'success' ? 'fa-circle-check' : 'fa-circle-exclamation';
            toast.innerHTML = `<i class="fa-solid ${icon}"></i> <span>${message}</span>`;
            container.appendChild(toast);
            setTimeout(() => { toast.remove(); }, 3500);
        }

        function switchMode(mode) {
            if(mode === 'kasir') {
                document.getElementById('view-kasir').style.display = 'flex';
                document.getElementById('view-admin').style.display = 'none';
                document.getElementById('btn-kasir').classList.add('active');
                document.getElementById('btn-admin').classList.remove('active');
                loadData(); 
            } else {
                document.getElementById('view-kasir').style.display = 'none';
                document.getElementById('view-admin').style.display = 'flex';
                document.getElementById('btn-kasir').classList.remove('active');
                document.getElementById('btn-admin').classList.add('active');
            }
        }

        // Fungsi Buka/Tutup Keranjang khusus layar HP (Drawer)
        function toggleMobileCart() {
            document.getElementById('cart-panel').classList.toggle('open-mobile');
        }

        window.onload = loadData;

        function getCategoryIcon(kategori) {
            const k = (kategori || '').toLowerCase();
            if(k.includes('makanan') || k.includes('cemilan')) return '🍜';
            if(k.includes('minuman')) return '🥤';
            if(k.includes('sembako')) return '🍚';
            return '📦';
        }

        function loadData() {
            const katalogDiv = document.getElementById('katalog');
            fetch(SCRIPT_URL)
                .then(res => res.json())
                .then(data => {
                    katalogDiv.innerHTML = '';
                    if(data.length === 0) {
                        katalogDiv.innerHTML = '<p style="grid-column: 1/-1; text-align:center; color:#95a5a6;">Belum ada barang.</p>';
                        return;
                    }
                    data.forEach(item => {
                        if(!item.Nama_Barang) return;
                        const emoji = getCategoryIcon(item.Kategori);
                        const harga = parseInt(item.Harga_Satuan).toLocaleString('id-ID');
                        const div = document.createElement('div');
                        div.className = 'card';
                        div.innerHTML = `<div class="card-icon">${emoji}</div><h3>${item.Nama_Barang}</h3><p>Rp ${harga}</p><span class="badge">${item.Kategori || 'Lainnya'}</span>`;
                        div.onclick = () => addToCart(item.Nama_Barang, item.Harga_Satuan);
                        katalogDiv.appendChild(div);
                    });
                })
                .catch(err => {
                    katalogDiv.innerHTML = '<p style="grid-column: 1/-1; text-align:center; color:#e74c3c;">Gagal memuat data.</p>';
                });
        }

        function addToCart(name, price) {
            const existingItem = cart.find(item => item.name === name);
            if(existingItem) {
                existingItem.qty += 1;
            } else {
                cart.push({ name: name, price: parseInt(price), qty: 1 });
            }
            renderCart();
        }

        function updateQty(index, delta) {
            cart[index].qty += delta;
            if(cart[index].qty <= 0) { cart.splice(index, 1); }
            renderCart();
        }

        function clearCart() {
            cart = [];
            renderCart();
        }

        function renderCart() {
            const container = document.getElementById('cart-items-container');
            const emptyCart = document.getElementById('empty-cart');
            const cartForm = document.getElementById('cart-form');
            const fabCount = document.getElementById('fab-count');
            
            // Hitung total item untuk badge di tombol HP
            const totalQty = cart.reduce((sum, item) => sum + item.qty, 0);
            fabCount.innerText = totalQty;

            if(cart.length === 0) {
                emptyCart.style.display = 'block';
                cartForm.style.display = 'none';
                return;
            }

            emptyCart.style.display = 'none';
            cartForm.style.display = 'block';
            container.innerHTML = '';
            
            let grandTotal = 0;
            cart.forEach((item, index) => {
                const subtotal = item.price * item.qty;
                grandTotal += subtotal;

                const div = document.createElement('div');
                div.className = 'cart-item';
                div.innerHTML = `
                    <div class="cart-item-info">
                        <h4>${item.name}</h4>
                        <p>Rp ${item.price.toLocaleString('id-ID')}</p>
                    </div>
                    <div class="qty-controls">
                        <button class="qty-btn" onclick="updateQty(${index}, -1)"><i class="fa-solid fa-minus"></i></button>
                        <span class="qty-number">${item.qty}</span>
                        <button class="qty-btn" onclick="updateQty(${index}, 1)"><i class="fa-solid fa-plus"></i></button>
                    </div>
                `;
                container.appendChild(div);
            });

            document.getElementById('grand-total').innerText = grandTotal.toLocaleString('id-ID');
        }

        function submitTransaction() {
            const itemsToSubmit = cart.map(item => ({
                nama_barang: item.name,
                harga_satuan: item.price,
                jumlah_beli: item.qty,
                total_harga: item.price * item.qty
            }));

            const payload = { action: 'transaksi_multi', items: itemsToSubmit };
            const btn = document.getElementById('btn-submit-trx');
            btn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i> Memproses...'; 
            btn.disabled = true;

            fetch(SCRIPT_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(payload) })
            .then(res => res.json())
            .then(() => {
                showToast('Transaksi berhasil!', 'success');
                btn.innerHTML = '<i class="fa-solid fa-print"></i> Proses Bayar'; 
                btn.disabled = false;
                clearCart();
                // Tutup drawer jika di HP
                document.getElementById('cart-panel').classList.remove('open-mobile');
            })
            .catch(err => {
                showToast('Gagal memproses.', 'error');
                btn.innerHTML = '<i class="fa-solid fa-print"></i> Proses Bayar'; 
                btn.disabled = false;
            });
        }

        function submitKatalog() {
            const payload = {
                action: 'tambah_katalog',
                nama_barang: document.getElementById('new-nama').value,
                kategori: document.getElementById('new-kategori').value,
                harga_satuan: parseInt(document.getElementById('new-harga').value),
                stok: parseInt(document.getElementById('new-stok').value)
            };
            if(!payload.nama_barang || !payload.harga_satuan) { showToast('Nama & Harga wajib diisi!', 'error'); return; }

            const btn = document.getElementById('btn-submit-katalog');
            btn.innerHTML = 'Menyimpan...'; btn.disabled = true;

            fetch(SCRIPT_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(payload) })
            .then(res => res.json())
            .then(() => {
                showToast('Barang berhasil ditambahkan!', 'success');
                btn.innerHTML = '<i class="fa-solid fa-cloud-arrow-up"></i> Simpan ke Database'; btn.disabled = false;
                document.getElementById('new-nama').value = '';
                document.getElementById('new-harga').value = '';
            });
        }
    </script>
</body>
</html>
